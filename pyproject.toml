[project]
name = "tempest-fauna-trail"
version = "0.1.0"
description = "A roguelike where animal champions travel real-world cities and live weather shapes each battle"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.84.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "flet-cli>=0.84.0",
    "flet-desktop>=0.84.0",
    "flet-web>=0.84.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "tempest-fauna-trail"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live API tests (require OPENWEATHER_API_KEY; skipped when absent)",
]
